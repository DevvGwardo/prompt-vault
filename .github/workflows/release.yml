name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release-mac:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          # electron 43 requires node >= 22.12 (EBADENGINE under engine-strict on
          # hosted runners with node 20); 24 also matches GitHub's forced action runtime.
          node-version: 24
          cache: npm

      - name: npm ci
        run: npm ci --no-audit --no-fund --foreground-scripts

      - name: Dump failure detail to annotation
        if: failure()
        shell: bash
        run: |
          echo "::error::node=$(node --version) npm=$(npm --version) os=$RUNNER_OS"
          LOG=$(ls -t "$HOME/.npm/_logs"/*.log 2>/dev/null | head -1)
          if [ -n "$LOG" ]; then
            MSG=$(tail -80 "$LOG" | tr '\n' ' ' | cut -c1-2600)
            echo "::error::NPM CI FAILED — $MSG"
          else
            echo "::error::NPM CI FAILED — no npm debug log found"
          fi

      - name: Build, sign, notarize, and publish (macOS)
        env:
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npx electron-builder --mac --arm64 --x64 --publish always

  release-win:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          # electron 43 requires node >= 22.12 (EBADENGINE under engine-strict on
          # hosted runners with node 20); 24 also matches GitHub's forced action runtime.
          node-version: 24
          cache: npm

      - name: npm ci
        run: npm ci --no-audit --no-fund --foreground-scripts

      - name: Dump failure detail to annotation
        if: failure()
        shell: bash
        run: |
          echo "::error::node=$(node --version) npm=$(npm --version) os=$RUNNER_OS"
          LOG=$(ls -t "$HOME/.npm/_logs"/*.log 2>/dev/null | head -1)
          if [ -n "$LOG" ]; then
            MSG=$(tail -80 "$LOG" | tr '\n' ' ' | cut -c1-2600)
            echo "::error::NPM CI FAILED — $MSG"
          else
            echo "::error::NPM CI FAILED — no npm debug log found"
          fi

      - name: Build and publish (Windows)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npx electron-builder --win --x64 --publish always

name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release-mac:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          # electron 43 requires node >= 22.12 (EBADENGINE under engine-strict on
          # hosted runners with node 20); 24 also matches GitHub's forced action runtime.
          node-version: 24
          cache: npm

      - name: npm ci
        run: |
          npm ci --no-audit --no-fund --foreground-scripts > /tmp/npm-ci.log 2>&1
          rc=$?
          if [ $rc -ne 0 ]; then
            MSG=$(tail -120 /tmp/npm-ci.log | tr '\n' ' ' | cut -c1-6500)
            echo "::error::npm ci exit $rc — $MSG"
            exit $rc
          fi

        shell: bash
        run: |
          echo "::error::node=$(node --version) npm=$(npm --version) os=$RUNNER_OS"
          if [ "$RUNNER_OS" = "Windows" ]; then CACHE="$LOCALAPPDATA/npm-cache"; else CACHE="$HOME/.npm"; fi
          LOG=$(ls -t "$CACHE/_logs"/*.log 2>/dev/null | head -1 || true)
          if [ -n "$LOG" ]; then
            ERRS=$(grep -m 40 -E "npm error|ERR!|EBAD|ERESOLVE|ENOENT|EACCES|EPERM|fatal|gyp |Command failed|lifecycle|prebuild|headers" "$LOG" | tr '\n' ' ' | cut -c1-6000 || true)
            TAIL=$(tail -60 "$LOG" | tr '\n' ' ' | cut -c1-4000 || true)
            echo "::error::NPM ERR: ${ERRS:-none} | LOGTAIL: $TAIL"
          else
            echo "::error::no npm debug log at $CACHE/_logs"
          fi

      - name: Build, sign, notarize, and publish (macOS)
        env:
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npx electron-builder --mac --arm64 --x64 --publish always

  release-win:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          # electron 43 requires node >= 22.12 (EBADENGINE under engine-strict on
          # hosted runners with node 20); 24 also matches GitHub's forced action runtime.
          node-version: 24
          cache: npm

      - name: npm ci
        run: |
          npm ci --no-audit --no-fund --foreground-scripts > /tmp/npm-ci.log 2>&1
          rc=$?
          if [ $rc -ne 0 ]; then
            MSG=$(tail -120 /tmp/npm-ci.log | tr '\n' ' ' | cut -c1-6500)
            echo "::error::npm ci exit $rc — $MSG"
            exit $rc
          fi

        shell: bash
        run: |
          echo "::error::node=$(node --version) npm=$(npm --version) os=$RUNNER_OS"
          if [ "$RUNNER_OS" = "Windows" ]; then CACHE="$LOCALAPPDATA/npm-cache"; else CACHE="$HOME/.npm"; fi
          LOG=$(ls -t "$CACHE/_logs"/*.log 2>/dev/null | head -1 || true)
          if [ -n "$LOG" ]; then
            ERRS=$(grep -m 40 -E "npm error|ERR!|EBAD|ERESOLVE|ENOENT|EACCES|EPERM|fatal|gyp |Command failed|lifecycle|prebuild|headers" "$LOG" | tr '\n' ' ' | cut -c1-6000 || true)
            TAIL=$(tail -60 "$LOG" | tr '\n' ' ' | cut -c1-4000 || true)
            echo "::error::NPM ERR: ${ERRS:-none} | LOGTAIL: $TAIL"
          else
            echo "::error::no npm debug log at $CACHE/_logs"
          fi

      - name: Build and publish (Windows)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npx electron-builder --win --x64 --publish always

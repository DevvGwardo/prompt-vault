name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release-mac:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          # electron 43 requires node >= 22.12 (EBADENGINE under engine-strict on
          # hosted runners with node 20); 24 also matches GitHub's forced action runtime.
          node-version: 24
          cache: npm

      - name: npm ci
        shell: bash
        run: |
          # `if !` keeps the failure inside the condition so set -e cannot kill
          # the step before the annotation is emitted.
          if ! npm ci --no-audit --no-fund --foreground-scripts > /tmp/npm-ci.log 2>&1; then
            ERRS=$(grep -m 12 -E "gyp ERR|error C[0-9]+|MSBUILD|fatal error|npm error|ELIFECYCLE|Command failed|exit code [1-9]|The build failed|LNK[0-9]+|cannot find|not recognized" /tmp/npm-ci.log | tr '\n' ' ' | cut -c1-6000)
            TAIL=$(tail -25 /tmp/npm-ci.log | tr '\n' ' ' | cut -c1-4000)
            echo "::error::npm ci failed - ERRS: ${ERRS:-none} | TAIL: $TAIL"
            exit 1
          fi


      - name: Build, sign, notarize, and publish (macOS)
        env:
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npx electron-builder --mac --arm64 --x64 --publish always

  release-win:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          # electron 43 requires node >= 22.12 (EBADENGINE under engine-strict on
          # hosted runners with node 20); 24 also matches GitHub's forced action runtime.
          node-version: 24
          cache: npm

      - name: npm ci
        shell: bash
        run: |
          # `if !` keeps the failure inside the condition so set -e cannot kill
          # the step before the annotation is emitted.
          if ! npm ci --no-audit --no-fund --foreground-scripts > /tmp/npm-ci.log 2>&1; then
            ERRS=$(grep -m 12 -E "gyp ERR|error C[0-9]+|MSBUILD|fatal error|npm error|ELIFECYCLE|Command failed|exit code [1-9]|The build failed|LNK[0-9]+|cannot find|not recognized" /tmp/npm-ci.log | tr '\n' ' ' | cut -c1-6000)
            TAIL=$(tail -25 /tmp/npm-ci.log | tr '\n' ' ' | cut -c1-4000)
            echo "::error::npm ci failed - ERRS: ${ERRS:-none} | TAIL: $TAIL"
            exit 1
          fi


      - name: Build and publish (Windows)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npx electron-builder --win --x64 --publish always
